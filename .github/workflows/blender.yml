name: blender-render

on:
  push:
    branches: [main]
    paths: ['data/**', 'blender/**', '.github/workflows/blender.yml']
  workflow_dispatch:
    inputs:
      clips:
        description: 'Comma-separated clip names (empty = default set)'
        required: false

permissions:
  contents: write

env:
  DATA: data/clips_standin.json
  DEFAULT_CLIPS: g_walk,g_run,g_creep,g_idle,chop,carry

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      clips: ${{ steps.p.outputs.clips }}
    steps:
      - id: p
        run: |
          c="${{ github.event.inputs.clips }}"; [ -z "$c" ] && c="$DEFAULT_CLIPS"
          echo "clips=$(echo "$c" | jq -R -c 'split(",")')" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJson(needs.plan.outputs.clips) }}
    env:
      RES: "320"
      LOOPS: "3"
      MAX_FRAMES: "100"
      CAMS: front,side,q34,feet
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg > /dev/null
      - name: Render ${{ matrix.clip }}
        run: CLIPS=${{ matrix.clip }} blender -b --factory-startup -P blender/render_joints.py -- "$DATA" out
      - name: Video and contact sheets
        run: |
          c=${{ matrix.clip }}; d=out/$c
          for cam in $(echo $CAMS | tr , ' '); do
            ffmpeg -loglevel error -y -i "$d/$cam/%04d.png" -vf "select='not(mod(n\,4))',scale=160:-1,tile=8x3:padding=2" -frames:v 1 "out/${c}_${cam}_sheet.png"
          done
          ffmpeg -loglevel error -y \
            -framerate 30 -i "$d/front/%04d.png" -framerate 30 -i "$d/side/%04d.png" \
            -framerate 30 -i "$d/q34/%04d.png"   -framerate 30 -i "$d/feet/%04d.png" \
            -filter_complex "[0][1]hstack[a];[2][3]hstack[b];[a][b]vstack" \
            -c:v libx264 -pix_fmt yuv420p "out/${c}_grid.mp4"
          cp "$d/info.txt" "out/${c}_info.txt"
          mkdir -p pub && cp out/*_sheet.png out/*.mp4 out/*_info.txt pub/
      - uses: actions/upload-artifact@v4
        with:
          name: pub-${{ matrix.clip }}
          path: pub

  publish:
    needs: render
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pub-*
          merge-multiple: true
          path: pub
      - name: Push previews to branch 'renders'
        run: |
          cd pub && ls
          git init -q -b renders
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "renders ${GITHUB_SHA::7}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" renders
